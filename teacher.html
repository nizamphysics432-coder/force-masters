<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Science Quiz - Teacher Dashboard</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    min-height: 100vh;
    color: #222;
}

.container {
    width: 95%;
    max-width: 1400px;
    margin: 30px auto;
}

/* LOGIN */
.login-card {
    max-width: 430px;
    margin: 80px auto;
    background: white;
    padding: 35px;
    border-radius: 20px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.25);
}

.login-card h1 {
    text-align: center;
    color: #5b3cc4;
    margin-bottom: 10px;
}

.login-card p {
    text-align: center;
    color: #666;
    margin-bottom: 25px;
}

input,
select {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 9px;
    font-size: 15px;
    margin-bottom: 15px;
}

button {
    border: none;
    padding: 12px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    font-size: 14px;
}

.login-btn {
    width: 100%;
    background: #5b3cc4;
    color: white;
    font-size: 16px;
}

.login-btn:hover {
    background: #472ba8;
}

.error {
    color: #d32f2f;
    background: #ffebee;
    padding: 10px;
    border-radius: 8px;
    margin-top: 15px;
    display: none;
}

/* DASHBOARD */
.dashboard {
    display: none;
}

.header {
    background: white;
    padding: 22px 25px;
    border-radius: 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 20px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.15);
}

.header h1 {
    margin: 0;
    color: #5b3cc4;
}

.header p {
    margin: 5px 0 0;
    color: #666;
}

.logout-btn {
    background: #e53935;
    color: white;
}

.logout-btn:hover {
    background: #c62828;
}

/* STATS */
.stats {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 15px;
    margin-bottom: 20px;
}

.stat-card {
    background: white;
    border-radius: 15px;
    padding: 20px;
    text-align: center;
    box-shadow: 0 8px 20px rgba(0,0,0,0.12);
}

.stat-card h3 {
    margin: 0;
    color: #666;
    font-size: 14px;
}

.stat-card .number {
    font-size: 30px;
    font-weight: bold;
    color: #5b3cc4;
    margin-top: 8px;
}

/* FILTERS */
.filter-card {
    background: white;
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.12);
}

.filter-card h2 {
    margin-top: 0;
    color: #5b3cc4;
}

.filters {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
}

.filter-group label {
    display: block;
    font-weight: bold;
    margin-bottom: 7px;
    font-size: 13px;
}

.filter-group input,
.filter-group select {
    margin-bottom: 0;
}

.actions {
    margin-top: 15px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.refresh-btn {
    background: #2196f3;
    color: white;
}

.refresh-btn:hover {
    background: #1976d2;
}

.clear-btn {
    background: #757575;
    color: white;
}

.clear-btn:hover {
    background: #616161;
}

/* TABLE */
.table-card {
    background: white;
    border-radius: 18px;
    padding: 20px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.12);
    overflow-x: auto;
}

.table-card h2 {
    margin-top: 0;
    color: #5b3cc4;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 1100px;
}

th {
    background: #5b3cc4;
    color: white;
    padding: 12px 8px;
    text-align: left;
    font-size: 13px;
}

td {
    padding: 11px 8px;
    border-bottom: 1px solid #eee;
    font-size: 13px;
}

tr:hover {
    background: #f8f6ff;
}

.status-normal {
    color: #2e7d32;
    background: #e8f5e9;
    padding: 5px 8px;
    border-radius: 6px;
    font-weight: bold;
}

.status-warning {
    color: #ef6c00;
    background: #fff3e0;
    padding: 5px 8px;
    border-radius: 6px;
    font-weight: bold;
}

.status-flagged {
    color: #c62828;
    background: #ffebee;
    padding: 5px 8px;
    border-radius: 6px;
    font-weight: bold;
}

.delete-btn {
    background: #e53935;
    color: white;
    padding: 7px 10px;
    font-size: 12px;
}

.delete-btn:hover {
    background: #c62828;
}

.no-results {
    text-align: center;
    padding: 35px;
    color: #777;
    font-size: 16px;
}

/* LOADING */
.loading {
    text-align: center;
    padding: 30px;
    color: #666;
}

/* RESPONSIVE */
@media (max-width: 1000px) {
    .stats {
        grid-template-columns: repeat(3, 1fr);
    }

    .filters {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 650px) {
    .container {
        width: 96%;
        margin: 15px auto;
    }

    .header {
        flex-direction: column;
        align-items: flex-start;
    }

    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

    .filters {
        grid-template-columns: 1fr;
    }

    .login-card {
        margin: 40px auto;
        padding: 25px;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- LOGIN -->
    <div id="loginSection" class="login-card">

        <h1>Science Quiz</h1>
        <p>Teacher Dashboard</p>

        <input
            type="email"
            id="email"
            placeholder="Teacher Email"
            autocomplete="email"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            autocomplete="current-password"
        >

        <button class="login-btn" onclick="login()">
            Login
        </button>

        <div id="loginError" class="error"></div>

    </div>


    <!-- DASHBOARD -->
    <div id="dashboardSection" class="dashboard">

        <!-- HEADER -->
        <div class="header">

            <div>
                <h1>Science Quiz - Teacher Dashboard</h1>
                <p id="teacherEmail"></p>
            </div>

            <button class="logout-btn" onclick="logout()">
                Logout
            </button>

        </div>


        <!-- STATS -->
        <div class="stats">

            <div class="stat-card">
                <h3>Total Results</h3>
                <div class="number" id="totalResults">0</div>
            </div>

            <div class="stat-card">
                <h3>Students</h3>
                <div class="number" id="totalStudents">0</div>
            </div>

            <div class="stat-card">
                <h3>Average Score</h3>
                <div class="number" id="averageScore">0%</div>
            </div>

            <div class="stat-card">
                <h3>Normal</h3>
                <div class="number" id="normalResults">0</div>
            </div>

            <div class="stat-card">
                <h3>Flagged</h3>
                <div class="number" id="flaggedResults">0</div>
            </div>

        </div>


        <!-- FILTERS -->
        <div class="filter-card">

            <h2>Filter Results</h2>

            <div class="filters">

                <!-- CLASS -->
                <div class="filter-group">
                    <label for="classFilter">Class</label>

                    <select id="classFilter" onchange="applyFilters()">
                        <option value="">All Classes</option>
                        <option value="6">Class 6</option>
                        <option value="7">Class 7</option>
                        <option value="8">Class 8</option>
                        <option value="9">Class 9</option>
                        <option value="10">Class 10</option>
                        <option value="11">Class 11</option>
                        <option value="12">Class 12</option>
                    </select>
                </div>


                <!-- CHAPTER -->
                <div class="filter-group">
                    <label for="chapterFilter">Chapter</label>

                    <select id="chapterFilter" onchange="applyFilters()">

                        <option value="">All Chapters</option>

                        <option value="Exploring Magnets">
                            Exploring Magnets
                        </option>

                        <option value="Adolescence: A Stage of Growth and Change">
                            Adolescence: A Stage of Growth and Change
                        </option>

                        <option value="Metals and Non-metals">
                            Metals and Non-metals
                        </option>

                        <option value="Particulate Nature of Matter">
                            Particulate Nature of Matter
                        </option>

                    </select>
                </div>


                <!-- STATUS -->
                <div class="filter-group">
                    <label for="statusFilter">Status</label>

                    <select id="statusFilter" onchange="applyFilters()">

                        <option value="">All Status</option>
                        <option value="Normal">Normal</option>
                        <option value="Possible Malpractice">
                            Possible Malpractice
                        </option>
                        <option value="Flagged">Flagged</option>

                    </select>
                </div>


                <!-- SEARCH -->
                <div class="filter-group">

                    <label for="studentSearch">
                        Student Search
                    </label>

                    <input
                        type="text"
                        id="studentSearch"
                        placeholder="Search student name..."
                        oninput="applyFilters()"
                    >

                </div>

            </div>


            <div class="actions">

                <button
                    class="refresh-btn"
                    onclick="loadResults()"
                >
                    Refresh Results
                </button>

                <button
                    class="clear-btn"
                    onclick="clearFilters()"
                >
                    Clear Filters
                </button>

            </div>

        </div>


        <!-- RESULTS -->
        <div class="table-card">

            <h2>Student Results</h2>

            <div id="loading" class="loading">
                Loading results...
            </div>

            <div id="noResults" class="no-results" style="display:none;">
                No results found.
            </div>

            <table id="resultsTable" style="display:none;">

                <thead>

                    <tr>
                        <th>#</th>
                        <th>Student</th>
                        <th>Class</th>
                        <th>Chapter</th>
                        <th>Score</th>
                        <th>Percentage</th>
                        <th>Grade</th>
                        <th>Violations</th>
                        <th>Status</th>
                        <th>Auto Submit</th>
                        <th>Date</th>
                        <th>Action</th>
                    </tr>

                </thead>

                <tbody id="resultsBody">
                </tbody>

            </table>

        </div>

    </div>

</div>


<script>

/* =========================================================
   FIREBASE CONFIGURATION
   ========================================================= */

const firebaseConfig = {

    apiKey: "AIzaSyCfI3zEpaiRA3OjgYiTuvnuA3GGyQGQNpU",

    authDomain:
        "sciencequiz2026-ccd77.firebaseapp.com",

    databaseURL:
        "https://sciencequiz2026-ccd77-default-rtdb.firebaseio.com",

    projectId:
        "sciencequiz2026-ccd77",

    storageBucket:
        "sciencequiz2026-ccd77.firebasestorage.app",

    messagingSenderId:
        "412753144312",

    appId:
        "1:412753144312:web:fe66b332abcadfb0438e0d",

    measurementId:
        "G-YC0DM7M07F"
};


/* =========================================================
   INITIALIZE FIREBASE
   ========================================================= */

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

const database = firebase.database();


/* =========================================================
   GLOBAL VARIABLES
   ========================================================= */

let allResults = [];

let resultsListener = null;


/* =========================================================
   AUTH STATE
   ========================================================= */

auth.onAuthStateChanged(function(user) {

    if (user) {

        document.getElementById("loginSection").style.display =
            "none";

        document.getElementById("dashboardSection").style.display =
            "block";

        document.getElementById("teacherEmail").textContent =
            "Logged in as: " + user.email;

        loadResults();

    } else {

        document.getElementById("loginSection").style.display =
            "block";

        document.getElementById("dashboardSection").style.display =
            "none";

    }

});


/* =========================================================
   LOGIN
   ========================================================= */

function login() {

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const errorBox =
        document.getElementById("loginError");


    errorBox.style.display = "none";
    errorBox.textContent = "";


    if (!email || !password) {

        errorBox.textContent =
            "Please enter your email and password.";

        errorBox.style.display = "block";

        return;
    }


    auth.signInWithEmailAndPassword(email, password)

        .then(function() {

            console.log("Login successful");

        })

        .catch(function(error) {

            console.error("Login error:", error);

            let message = error.message;


            if (
                error.code ===
                "auth/api-key-not-valid"
            ) {

                message =
                    "Firebase API key is not valid. Please check the Firebase configuration.";

            }

            else if (
                error.code ===
                "auth/invalid-credential"
            ) {

                message =
                    "Invalid email or password.";

            }

            else if (
                error.code ===
                "auth/user-not-found"
            ) {

                message =
                    "No teacher account exists with this email.";

            }

            else if (
                error.code ===
                "auth/wrong-password"
            ) {

                message =
                    "Incorrect password.";

            }

            else if (
                error.code ===
                "auth/invalid-email"
            ) {

                message =
                    "Please enter a valid email address.";

            }


            errorBox.textContent = message;

            errorBox.style.display = "block";

        });

}


/* =========================================================
   LOGOUT
   ========================================================= */

function logout() {

    auth.signOut()
        .then(function() {

            allResults = [];

            document.getElementById("resultsBody").innerHTML = "";

        })
        .catch(function(error) {

            console.error("Logout error:", error);

        });

}


/* =========================================================
   LOAD RESULTS
   ========================================================= */

function loadResults() {

    const loading =
        document.getElementById("loading");

    const table =
        document.getElementById("resultsTable");

    const noResults =
        document.getElementById("noResults");


    loading.style.display = "block";
    table.style.display = "none";
    noResults.style.display = "none";


    if (resultsListener) {

        database
            .ref("quizResults")
            .off("value", resultsListener);

    }


    resultsListener =
        function(snapshot) {

            allResults = [];


            snapshot.forEach(function(childSnapshot) {

                const data =
                    childSnapshot.val();

                data._key =
                    childSnapshot.key;

                allResults.push(data);

            });


            /* newest first */

            allResults.sort(function(a, b) {

                const timeA =
                    Number(a.timestamp || 0);

                const timeB =
                    Number(b.timestamp || 0);

                return timeB - timeA;

            });


            loading.style.display = "none";

            updateChapterOptions();

            applyFilters();

        };


    database
        .ref("quizResults")
        .on("value", resultsListener, function(error) {

            console.error(
                "Firebase database error:",
                error
            );

            loading.style.display = "none";

            noResults.style.display = "block";

            noResults.textContent =
                "Unable to load results: " +
                error.message;

        });

}


/* =========================================================
   UPDATE CHAPTER DROPDOWN
   ========================================================= */

function updateChapterOptions() {

    const chapterFilter =
        document.getElementById("chapterFilter");


    const selected =
        chapterFilter.value;


    const chapters = new Set();


    /*
       Always keep known chapters
       even if there are currently
       no results.
    */

    chapters.add("Exploring Magnets");

    chapters.add(
        "Adolescence: A Stage of Growth and Change"
    );

    chapters.add(
        "Metals and Non-metals"
    );

    chapters.add(
        "Particulate Nature of Matter"
    );


    /*
       Also add any chapter
       found in Firebase.
    */

    allResults.forEach(function(result) {

        const chapter =
            String(result.chapter || "").trim();

        if (chapter) {

            chapters.add(chapter);

        }

    });


    chapterFilter.innerHTML =
        '<option value="">All Chapters</option>';


    Array.from(chapters)
        .sort()
        .forEach(function(chapter) {

            const option =
                document.createElement("option");

            option.value = chapter;

            option.textContent = chapter;

            chapterFilter.appendChild(option);

        });


    if (
        Array.from(chapters).includes(selected)
    ) {

        chapterFilter.value = selected;

    }

}


/* =========================================================
   APPLY FILTERS
   ========================================================= */

function applyFilters() {

    const classValue =
        document.getElementById("classFilter").value;


    const chapterValue =
        document.getElementById("chapterFilter").value;


    const statusValue =
        document.getElementById("statusFilter").value;


    const searchValue =
        document.getElementById("studentSearch")
            .value
            .trim()
            .toLowerCase();


    const filtered =
        allResults.filter(function(result) {


            /* CLASS */

            if (classValue) {

                const resultClass =
                    String(result.classId || "").trim();

                if (resultClass !== classValue) {

                    return false;

                }

            }


            /* CHAPTER */

            if (chapterValue) {

                const resultChapter =
                    String(result.chapter || "").trim();

                if (
                    resultChapter !==
                    chapterValue
                ) {

                    return false;

                }

            }


            /* STATUS */

            if (statusValue) {

                const resultStatus =
                    String(result.status || "").trim();

                if (
                    resultStatus !==
                    statusValue
                ) {

                    return false;

                }

            }


            /* STUDENT SEARCH */

            if (searchValue) {

                const studentName =
                    String(result.name || "")
                        .toLowerCase();

                if (
                    !studentName.includes(
                        searchValue
                    )
                ) {

                    return false;

                }

            }


            return true;

        });


    renderResults(filtered);

    updateStats(filtered);

}


/* =========================================================
   RENDER RESULTS
   ========================================================= */

function renderResults(results) {

    const tbody =
        document.getElementById("resultsBody");

    const table =
        document.getElementById("resultsTable");

    const noResults =
        document.getElementById("noResults");


    tbody.innerHTML = "";


    if (results.length === 0) {

        table.style.display = "none";

        noResults.style.display = "block";

        noResults.textContent =
            "No results found.";

        return;

    }


    table.style.display = "table";

    noResults.style.display = "none";


    results.forEach(function(result, index) {

        const row =
            document.createElement("tr");


        const name =
            escapeHTML(
                result.name || "-"
            );


        const classId =
            escapeHTML(
                result.classId || "-"
            );


        const chapter =
            escapeHTML(
                result.chapter || "-"
            );


        const score =
            result.score !== undefined
                ? result.score
                : "-";


        const total =
            result.total !== undefined
                ? result.total
                : "-";


        const percentage =
            result.percentage !== undefined
                ? result.percentage
                : "-";


        const grade =
            escapeHTML(
                result.grade || "-"
            );


        const violations =
            result.violations !== undefined
                ? result.violations
                : 0;


        let status =
            String(
                result.status || "Normal"
            ).trim();


        let statusClass =
            "status-normal";


        if (
            status.toLowerCase()
                .includes("flag")
        ) {

            statusClass =
                "status-flagged";

        }

        else if (
            status.toLowerCase()
                .includes("malpractice")
        ) {

            statusClass =
                "status-warning";

        }


        const automaticSubmission =
            result.automaticSubmission
                ? "Yes"
                : "No";


        const date =
            escapeHTML(
                result.date || "-"
            );


        row.innerHTML = `

            <td>${index + 1}</td>

            <td>
                <strong>${name}</strong>
            </td>

            <td>
                ${classId}
            </td>

            <td>
                ${chapter}
            </td>

            <td>
                ${score} / ${total}
            </td>

            <td>
                <strong>${percentage}%</strong>
            </td>

            <td>
                ${grade}
            </td>

            <td>
                ${violations}
            </td>

            <td>
                <span class="${statusClass}">
                    ${escapeHTML(status)}
                </span>
            </td>

            <td>
                ${automaticSubmission}
            </td>

            <td>
                ${date}
            </td>

            <td>
                <button
                    class="delete-btn"
                    onclick="deleteResult('${result._key}')"
                >
                    Delete
                </button>
            </td>

        `;


        tbody.appendChild(row);

    });

}


/* =========================================================
   UPDATE STATISTICS
   ========================================================= */

function updateStats(results) {

    const total =
        results.length;


    const students =
        new Set();


    let percentageTotal = 0;

    let percentageCount = 0;

    let normal = 0;

    let flagged = 0;


    results.forEach(function(result) {

        if (result.name) {

            students.add(
                String(result.name).trim()
            );

        }


        const percentage =
            Number(result.percentage);


        if (
            Number.isFinite(percentage)
        ) {

            percentageTotal += percentage;

            percentageCount++;

        }


        const status =
            String(
                result.status || "Normal"
            ).toLowerCase();


        if (
            status === "flagged" ||
            status.includes("flag")
        ) {

            flagged++;

        }

        else if (
            status.includes("malpractice")
        ) {

            flagged++;

        }

        else {

            normal++;

        }

    });


    const average =
        percentageCount > 0
            ? (
                percentageTotal /
                percentageCount
            ).toFixed(1)
            : "0";


    document.getElementById(
        "totalResults"
    ).textContent = total;


    document.getElementById(
        "totalStudents"
    ).textContent = students.size;


    document.getElementById(
        "averageScore"
    ).textContent =
        average + "%";


    document.getElementById(
        "normalResults"
    ).textContent =
        normal;


    document.getElementById(
        "flaggedResults"
    ).textContent =
        flagged;

}


/* =========================================================
   DELETE RESULT
   ========================================================= */

function deleteResult(key) {

    if (!key) {

        alert(
            "Result ID is missing."
        );

        return;

    }


    const confirmed =
        confirm(
            "Are you sure you want to delete this result?"
        );


    if (!confirmed) {

        return;

    }


    database
        .ref("quizResults/" + key)
        .remove()

        .then(function() {

            console.log(
                "Result deleted successfully."
            );

        })

        .catch(function(error) {

            console.error(
                "Delete error:",
                error
            );

            alert(
                "Unable to delete result: " +
                error.message
            );

        });

}


/* =========================================================
   CLEAR FILTERS
   ========================================================= */

function clearFilters() {

    document.getElementById(
        "classFilter"
    ).value = "";


    document.getElementById(
        "chapterFilter"
    ).value = "";


    document.getElementById(
        "statusFilter"
    ).value = "";


    document.getElementById(
        "studentSearch"
    ).value = "";


    applyFilters();

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}
