<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Dashboard</title><style>body{font-family:Arial;margin:0;background:#f2f5f9}.wrap{max-width:1300px;margin:auto;padding:18px}.card{background:#fff;padding:18px;border-radius:14px;margin:15px 0;box-shadow:0 3px 15px #0001}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#f6f8fb;padding:14px;border-radius:9px}.num{font-size:28px;font-weight:700}input,select{padding:10px;margin:4px;border:1px solid #ccd5e0;border-radius:7px}button{padding:10px 14px;border:0;border-radius:8px;background:#2457a6;color:#fff;font-weight:700}.danger{background:#b42318}.hidden{display:none}table{border-collapse:collapse;width:100%;min-width:1150px}th,td{padding:9px;border-bottom:1px solid #ddd;text-align:left;font-size:13px}th{background:#edf2f7}.table{overflow:auto}.badge{padding:4px 7px;border-radius:10px}.normal{background:#e5f5e8}.possible{background:#fff0bf}.flagged{background:#ffdede}</style></head><body><div id="login" class="card" style="max-width:420px;margin:70px auto"><h1>Teacher Dashboard</h1><input id="email" type="email" placeholder="Teacher email" style="width:95%"><input id="pass" type="password" placeholder="Password" style="width:95%"><button id="loginBtn">Login</button><p id="lm"></p></div><div id="app" class="wrap hidden"><div class="card"><h1>🧲 Science Quiz Results</h1><p>Grade 6 - Exploring Magnets</p><button id="refresh">Refresh</button> <button id="logout">Logout</button></div><div class="card grid"><div class="stat">Attempts<div class="num" id="a">0</div></div><div class="stat">Average<div class="num" id="av">0%</div></div><div class="stat">Highest<div class="num" id="hi">0%</div></div><div class="stat">Violations<div class="num" id="al">0</div></div></div><div class="card"><select id="cf"><option value="all">All Classes</option><option value="6">Class 6</option><option value="7">Class 7</option><option value="8">Class 8</option></select><select id="sf"><option value="all">All Status</option><option>Normal</option><option>Possible Malpractice</option><option>Flagged</option></select><input id="search" placeholder="Search student/chapter"></div><div class="card table"><table><thead><tr><th>Rank</th><th>Student</th><th>Class</th><th>Chapter</th><th>Score</th><th>%</th><th>Grade</th><th>Correct</th><th>Wrong</th><th>Unanswered</th><th>Violations</th><th>Status</th><th>Submitted</th><th>Action</th></tr></thead><tbody id="tb"></tbody></table></div></div><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script>const firebaseConfig={apiKey:"AIzaSyCfI3zEpaiRA3OjgYiTuvnuA3GGyQGQNpU",authDomain:"sciencequiz2026-ccd77.firebaseapp.com",databaseURL:"https://sciencequiz2026-ccd77-default-rtdb.firebaseio.com",projectId:"sciencequiz2026-ccd77",storageBucket:"sciencequiz2026-ccd77.firebasestorage.app",messagingSenderId:"412753144312",appId:"1:412753144312:web:fe66b332abcadfb0438e0d",measurementId:"G-YC0DM7M07F"};firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.database();let data={};const $=x=>document.getElementById(x);$('loginBtn').onclick=()=>auth.signInWithEmailAndPassword($('email').value,$('pass').value).catch(e=>$('lm').textContent=e.message);auth.onAuthStateChanged(u=>{if(u){$('login').classList.add('hidden');$('app').classList.remove('hidden');db.ref('quizResults').on('value',s=>{data=s.val()||{};render()})}else{$('login').classList.remove('hidden');$('app').classList.add('hidden')}});function render(){const c=$('cf').value,s=$('sf').value,term=$('search').value.toLowerCase();let rows=Object.entries(data).map(([id,r])=>({id,...r})).filter(r=>(c==='all'||String(r.classId)===c)&&(s==='all'||(r.malpracticeStatus||'Normal')===s)&&(!term||String(r.name||'').toLowerCase().includes(term)||String(r.chapter||r.quizTitle||'').toLowerCase().includes(term))).sort((x,y)=>(y.percentage||0)-(x.percentage||0)||(y.timestamp||0)-(x.timestamp||0));$('a').textContent=rows.length;$('av').textContent=rows.length?Math.round(rows.reduce((z,r)=>z+(r.percentage||0),0)/rows.length)+'%':'0%';$('hi').textContent=rows.length?Math.max(...rows.map(r=>r.percentage||0))+'%':'0%';$('al').textContent=rows.filter(r=>(r.violations||0)>0).length;$('tb').innerHTML=rows.map((r,i)=>{let st=r.malpracticeStatus||'Normal',cl=st==='Flagged'?'flagged':st==='Possible Malpractice'?'possible':'normal';return `<tr><td>${i+1}</td><td><b>${r.name||'-'}</b></td><td>${r.classId||'-'}</td><td>${r.chapter||r.quizTitle||'-'}</td><td>${r.score||0}/${r.total||60}</td><td>${r.percentage||0}%</td><td>${r.grade||'-'}</td><td>${r.correct||0}</td><td>${r.wrong||0}</td><td>${r.unanswered||0}</td><td>${r.violations||0}</td><td><span class="badge ${cl}">${st}</span></td><td>${r.date||'-'}</td><td><button class="danger" onclick="del('${r.id}')">Delete</button></td></tr>`}).join('')}window.del=async id=>{if(confirm('Delete this result permanently?'))await db.ref('quizResults/'+id).remove()};['cf','sf','search'].forEach(x=>$(x).addEventListener(x==='search'?'input':'change',render));$('refresh').onclick=render;$('logout').onclick=()=>auth.signOut();</script></body></html>
